name: Subfolder Builder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Print current directory
        run: pwd

      - name: List files
        run: ls -la

      - name: Build folder confirmed
        run: echo "Build folder confirmed"