name: Building Blocks
on:
  push:

jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello, World!"
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Say goodbye
        uses: actions/checkout@v2
      - name: Echo Goodbye
        run: echo "Goodbye, World!"
    